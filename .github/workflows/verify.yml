name: Verify workflow kit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest==8.4.1

      - name: Validate governance catalog and locks
        run: |
          python scripts/refresh_local_lock.py
          python scripts/validate_governance.py

      - name: Validate runtime policy and lifecycle schemas
        run: |
          python scripts/validate_task_contract.py --help
          python scripts/validate_task_contract.py governance/examples/standard-task-contract.json
          python scripts/validate_task_contract.py governance/examples/governed-release-contract.json
          python scripts/policy_router.py --help
          python scripts/runtime_router.py --help
          python scripts/runtime_policy.py --help
          python scripts/event_log.py --help
          python scripts/resolve_components.py --help
          python scripts/skill_lifecycle.py --help

      - name: Reject floating dependency drift
        run: python scripts/audit_floating_dependencies.py

      - name: Run toolkit tests
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Run repo-template tests in isolation
        env:
          PYTHONPATH: repo-template
        run: python -m pytest -q -p no:cacheprovider repo-template/tests

      - name: Run deterministic Eval fixture
        run: |
          python scripts/eval_harness.py --suite eval/fixtures/routing-demo.json --runner fixture --output "$RUNNER_TEMP/v42-eval.json"
          python scripts/eval_harness.py --suite eval/fixtures/routing-demo.json --runner fixture --mode shadow --output "$RUNNER_TEMP/v42-shadow.json"

      - name: Build clean release evidence outside the repository
        env:
          PYTHONPATH: .
        run: |
          mkdir -p "$RUNNER_TEMP/v42-release"
          python scripts/build_plugin.py --root . --output "$RUNNER_TEMP/v42-release/junwei-core" --profile stable
          python scripts/build_release.py --require-clean --output-dir "$RUNNER_TEMP/v42-release/archive"
          python scripts/build_release_evidence.py write --root . --output "$RUNNER_TEMP/v42-release/evidence" --archive "$RUNNER_TEMP/v42-release/archive/codex-workflow-kit-$(cat VERSION).tar.gz" --plugin "$RUNNER_TEMP/v42-release/junwei-core" --eval-report "$RUNNER_TEMP/v42-eval.json" --eval-report "$RUNNER_TEMP/v42-shadow.json" --require-clean-source
          python scripts/build_release_evidence.py verify --root . --output "$RUNNER_TEMP/v42-release/evidence" --archive "$RUNNER_TEMP/v42-release/archive/codex-workflow-kit-$(cat VERSION).tar.gz" --plugin "$RUNNER_TEMP/v42-release/junwei-core" --eval-report "$RUNNER_TEMP/v42-eval.json" --eval-report "$RUNNER_TEMP/v42-shadow.json" --require-resolved --require-clean-source --require-eval
          git diff --exit-code -- MANIFEST.sha256

      - name: Verify portable package contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verify_toolkit.py
